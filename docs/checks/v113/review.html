<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>SEA — 波の改善記録 V113</title>
<style>body{margin:0;background:#102630;color:#e3eff4;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:24px}video{display:block;width:100%;height:auto;background:#102630}button,a{color:inherit}button{padding:10px 18px;margin:8px 6px 0 0;background:#254954;border:1px solid #60838a;border-radius:8px}p{line-height:1.7;color:#b8cfd7}.note{font-size:14px}</style>
<main><h1>SEA — 新島の波・改善中の実画面 V113</h1>
<video controls preload="metadata" poster="wave-lifecycle.jpg" src="wave-lifecycle.mp4" aria-label="新島の波・18秒のゲーム映像、音声あり"></video>
<button id="play">音付きで再生</button><button id="pause">一時停止</button><span id="times"></span><p id="status" role="status"></p>
<button id="front">正面の波を見る</button><button id="shore">水際の泡を見る</button>
<p>空の映り込み、波頭から水が出る接合部、移動する波からの落下を修正したゲーム映像です。波・風の音はゲームと同じ音声グラフから作っています。</p>
<p class="note">18.1秒・10fps。物理を1/60秒ずつ進めた実画面の収録で、実時間FPSの証明ではありません。白水の立体感や大きな巻き込みは引き続き改善中です。</p>
<p><a href="wave-lifecycle.mp4" download>音付きMP4を保存</a> · <a href="../../breaking-wave-status-v113.md">変更と検証条件</a></p></main>
<script>
const v=document.querySelector('video'),status=document.querySelector('#status');
document.querySelector('#play').onclick=async()=>{v.muted=false;v.volume=1;try{await v.play();status.textContent='音声ありで再生中';}catch(e){status.textContent='再生できませんでした: '+e.message;}};
document.querySelector('#pause').onclick=()=>v.pause();
for(const [id,name] of [['front','wave'],['shore','shore']])document.querySelector('#'+id).onclick=()=>{v.pause();v.src=name+'-lifecycle.mp4';v.poster=name+'-lifecycle.jpg';status.textContent='視点を変更しました。「音付きで再生」で確認できます。';};
v.onended=()=>{status.textContent='18.1秒の再生が完了しました';};
for(const t of [0,4,9,14,18]){const b=document.createElement('button');b.textContent=t+'秒';b.onclick=()=>{v.pause();v.currentTime=t;};document.querySelector('#times').append(b);}
</script></html>
