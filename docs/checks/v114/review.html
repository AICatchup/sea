<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>SEA — 波と白水の改善記録 V114</title>
<style>body{margin:0;background:#102630;color:#e3eff4;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:24px}video{display:block;width:min(100%,calc(65vh * 1.5472));height:auto;margin:auto;background:#102630}video:fullscreen{width:100%;height:100%;object-fit:contain}button,a{color:inherit}button{padding:10px 18px;margin:8px 6px 0 0;background:#254954;border:1px solid #60838a;border-radius:8px}p{line-height:1.7;color:#b8cfd7}.note{font-size:14px}</style>
<main><h1>SEA — 波と白水の改善記録 V114</h1>
<video controls preload="metadata" poster="wave-lifecycle.jpg" src="wave-lifecycle.mp4" aria-label="新島の波・18秒のゲーム映像、音声あり"></video>
<button id="play">音付きで再生</button><button id="pause">一時停止</button><span id="times"></span><p id="status" role="status"></p>
<button id="front">正面の波を見る</button><button id="side">近い側面を見る</button>
<p>波頭からの水の供給、着水、立体の泡とその減衰を改修したゲーム画面です。波・風の音はゲームと同じ音声グラフから作っています。</p>
<p class="note">24fps・433フレーム。最大1/60秒の計算刻みで収録しており、実時間FPSの測定ではありません。大きな巻き込みや波面の滑らかさには改善の余地があり、実写同等の達成報告ではありません。</p>
<p><a href="wave-lifecycle.mp4" download>正面の音付きMP4を保存</a> · <a href="side-lifecycle.mp4" download>側面の音付きMP4を保存</a> · <a href="../../breaking-wave-status-v114.md">変更と検証条件</a></p></main>
<script>
const v=document.querySelector('video'),status=document.querySelector('#status');
document.querySelector('#play').onclick=async()=>{v.muted=false;v.volume=1;try{await v.play();status.textContent='音声ありで再生中';}catch(e){status.textContent='再生できませんでした: '+e.message;}};
document.querySelector('#pause').onclick=()=>v.pause();
for(const [id,name] of [['front','wave'],['side','side']])document.querySelector('#'+id).onclick=()=>{v.pause();v.src=name+'-lifecycle.mp4';v.poster=name+'-lifecycle.jpg';status.textContent='視点を変更しました。「音付きで再生」で確認できます。';};
v.onended=()=>{status.textContent='再生が完了しました';};
for(const t of [0,4,7,10,14,18]){const b=document.createElement('button');b.textContent=t+'秒';b.onclick=()=>{v.pause();v.currentTime=t;};document.querySelector('#times').append(b);}
</script></html>
