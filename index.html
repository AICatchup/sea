<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071923" />
    <meta name="description" content="式根島、泊海水浴場から始まる海の旅。浜を歩き、海を泳ぎ、水中へ潜り、船で島へ出かける体験。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>SEA — 式根島、泊海水浴場。</title>
  </head>
  <body>
    <canvas id="ocean" aria-label="式根島の泊海水浴場。WASDで移動、ドラッグで見回し、SpaceとCで上下へ移動します。"></canvas>
    <div id="loading" class="loading" role="status"><span class="loading-mark">∿</span><span>海が、目を覚ます。</span></div>
    <div id="unsupported" class="unsupported" hidden>
      <span class="wordmark">SEA</span><h1>この海には、GPUが必要です。</h1>
      <p id="error-detail">WebGL 2に対応したブラウザで、ハードウェアアクセラレーションを有効にして開いてください。</p>
      <button onclick="location.reload()">もう一度開く</button>
    </div>
    <div id="interface" class="interface">
      <header class="header">
        <button class="brand" id="home" type="button" aria-label="視点を戻す"><svg viewBox="0 0 38 20" fill="none" aria-hidden="true"><path d="M1 7c5-8 9 8 15 0S26 15 37 7M1 14c5-8 9 8 15 0s10 8 21 0" stroke="currentColor" stroke-width="1.4"/></svg><span>SEA</span><span class="brand-note">どこまでも、海。</span></button>
        <div class="header-actions">
          <button id="sound" class="icon-button" aria-label="波の音をオンにする" aria-pressed="false" title="波の音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/></svg></button>
          <button id="capture" class="icon-button" aria-label="海の写真を保存" title="写真を保存"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 6 8H3v12h18V8h-3l-2-3H8Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
          <button id="immersive" class="icon-button" aria-label="没入モードにする" aria-pressed="false" title="没入モード · H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
        </div>
      </header>
      <main class="intro" hidden aria-hidden="true">
        <span class="eyebrow"><span class="live-dot"></span> A MOMENT AT SEA</span>
        <h1>ただ、海に<br />身をまかせる。</h1>
        <p>波は、ひとつとして同じではない。</p>
      </main>
      <aside class="environment collapsed" id="environment" aria-label="海の環境">
        <button id="environment-toggle" class="environment-heading" aria-expanded="false" aria-controls="environment-body"><span>海の表情</span><span class="panel-symbol">+</span></button>
        <div id="environment-body" class="environment-body">
          <div class="preset-grid" role="group" aria-label="空と海のプリセット">
            <button class="preset" data-preset="golden" aria-pressed="false"><span class="preset-color golden"></span><span>夕凪</span><span class="preset-en">GOLDEN</span></button>
            <button class="preset active" data-preset="day" aria-pressed="true"><span class="preset-color day"></span><span>青い海</span><span class="preset-en">DAYLIGHT</span></button>
            <button class="preset" data-preset="storm" aria-pressed="false"><span class="preset-color storm"></span><span>荒天</span><span class="preset-en">SQUALL</span></button>
            <button class="preset" data-preset="dusk" aria-pressed="false"><span class="preset-color dusk"></span><span>薄明</span><span class="preset-en">BLUE HOUR</span></button>
          </div>
          <label class="range-label" for="wind"><span>風の強さ</span><output id="wind-value" for="wind">7.5 <small>m/s</small></output></label>
          <input type="range" id="wind" min="2" max="18" step="0.1" value="7.5" aria-label="風の強さ（メートル毎秒）" />
          <label class="range-label" for="swell"><span>うねり</span><output id="swell-value" for="swell">1.0 <small>×</small></output></label>
          <input type="range" id="swell" min="0.3" max="2" step="0.01" value="1" aria-label="うねりの大きさ" />
          <div class="panel-footer"><label for="quality">描画品質</label><select id="quality" aria-label="描画品質"><option value="auto">自動</option><option value="high">高</option><option value="medium">標準</option><option value="low">軽量</option></select><button id="reset-view" title="視点を戻す" aria-label="視点を戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7"/></svg></button></div>
        </div>
      </aside>
      <footer class="footer"><span class="coordinates"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1 3 7-3 7-3-7 3-7Z"/><path d="M8 1v14"/></svg> 式根島 <span class="separator">/</span> <span id="scene-label">青い海</span></span><span class="interaction-hint">WASD で移動 <span>·</span> ドラッグで見回す <span>·</span> Space / C で上下 <span>·</span> E で船に乗る・降りる</span><button id="pause" aria-label="一時停止する" aria-pressed="false"><svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10m6-10v10"/></svg><svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 8 5-8 5V3Z"/></svg><span id="pause-label">ひと休み</span></button></footer>
    </div>
    <button id="leave-immersive" class="leave-immersive" hidden aria-label="操作画面を表示">画面に戻る <span>H</span></button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
